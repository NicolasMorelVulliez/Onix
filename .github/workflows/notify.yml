# Wakes up the notification job every 5 minutes (GitHub may run it a few minutes late;
# reminders are sent up to 3 minutes early to compensate).
name: Notificaciones

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Llamar a /api/cron/tick
        run: |
          curl --fail-with-body -sS -m 60 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.ONIX_API_URL || 'https://onix-taupe.vercel.app' }}/api/cron/tick"
