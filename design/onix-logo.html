<title>Onix · logo</title>
<style>
:root{--bg:#f5f5f7;--fg:#1d1d1f;--muted:#6e6e73;--card:#fff;--line:rgba(0,0,0,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#000;--fg:#f5f5f7;--muted:#a1a1a6;--card:#1c1c1e;--line:rgba(255,255,255,.1)}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
main{max-width:1120px;margin:0 auto;padding:48px 16px 72px}
h1{font:700 40px/1.1 -apple-system,"SF Pro Display",system-ui;letter-spacing:-.025em;margin:0 0 6px}
.lead{color:var(--muted);margin:0 0 32px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px}
.big{display:block;width:100%;max-width:260px;margin:4px auto 18px;filter:drop-shadow(0 14px 28px rgba(0,0,0,.22))}
h2{font:600 20px/1.2 -apple-system,"SF Pro Display",system-ui;letter-spacing:-.015em;margin:0 0 4px}
.note{color:var(--muted);font-size:13px;margin:0 0 16px}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 8px}
.home{display:flex;gap:10px}
.screen{flex:1;border-radius:18px;padding:16px 10px;display:flex;justify-content:center;gap:18px}
.screen div{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px}
.screen img{width:60px;height:60px}
.l{background:linear-gradient(160deg,#dfe6ee,#c9d3dd);color:#1d1d1f}.d{background:linear-gradient(160deg,#1f2530,#0b0d12);color:#f5f5f7}
.ghost{width:60px;height:60px;border-radius:14px;background:rgba(255,255,255,.35)}.d .ghost{background:rgba(255,255,255,.08)}
.sizes{display:flex;align-items:flex-end;gap:14px}.sizes img{display:block}
.lock{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--bg)}
.lock img{width:26px;height:26px}.lock span{font:600 18px -apple-system,"SF Pro Display",system-ui;letter-spacing:-.01em}
.tab{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:8px 8px 0 0;background:var(--bg);font-size:12px}
.tab img{width:16px;height:16px}
</style></head><body><main>
